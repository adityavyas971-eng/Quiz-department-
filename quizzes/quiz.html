<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d1b"><title>Classroom Quiz</title><style>
:root{color-scheme:dark;--bg:#080c18;--panel:#111a2d;--line:#263653;--gold:#f6c85f;--muted:#aab8cf}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#1a2450 0,transparent 38%),var(--bg);color:#f5f7ff;font:16px/1.5 system-ui,Arial,sans-serif}header{padding:16px max(5vw,18px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:1px}.brand span{color:var(--gold)}a{color:var(--gold)}main{width:min(900px,100% - 32px);margin:28px auto}.panel{padding:clamp(18px,4vw,32px);background:linear-gradient(145deg,#131e33,#0e1628);border:1px solid var(--line);border-radius:20px;margin-bottom:16px}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:clamp(26px,5vw,42px);line-height:1.1;margin:8px 0}.muted{color:var(--muted);font-size:14px}.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.team{background:#0b1425;border:1px solid #344866;border-radius:12px;padding:12px;text-align:center}.team strong{display:block;font-size:20px;color:var(--gold)}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:750;cursor:pointer;background:var(--gold);color:#17120a}button.secondary{background:#202e49;color:#eaf0ff;border:1px solid #3b4e70}button:disabled{opacity:.55;cursor:not-allowed}.question{font-size:clamp(19px,3vw,25px);font-weight:750;margin:12px 0 18px}.answers{display:grid;gap:10px}.answer{background:#182642;border:1px solid #344866;color:#f5f7ff;text-align:left;width:100%;padding:14px;border-radius:12px}.answer:hover:not(:disabled){border-color:var(--gold)}.answer.correct{background:#15432f;border-color:#42cc87}.answer.wrong{background:#4a2630;border-color:#ff7182}.message{min-height:24px;font-weight:700;margin:14px 0 0}.hide{display:none!important}.timer{font-weight:900;color:var(--gold);font-size:20px}.footer{text-align:center;color:#72829b;padding:15px;font-size:12px}select,input{background:#101a2d;color:white;border:1px solid #344866;border-radius:8px;padding:10px}.score{font-size:clamp(35px,8vw,60px);font-weight:900;color:var(--gold)}
</style></head><body><header><div class="brand">QUIZ <span>DEPARTMENT</span></div><a href="../index.html">Library</a></header><main>
<section class="panel"><div class="topline"><div><div class="eyebrow">Classroom mode</div><h1 id="title">Classroom Quiz</h1><div id="subtitle" class="muted">Take turns answering with your class.</div></div><div class="timer" id="timer" aria-live="polite">—</div></div></section>
<section class="panel" id="setup"><h2>Set up teams</h2><p class="muted">Choose the number of teams and question timer, then start the quiz.</p><div class="controls"><label>Teams <select id="teamCount"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label><label>Seconds per question <select id="seconds"><option value="0">No timer</option><option>15</option><option selected>30</option><option>45</option><option>60</option></select></label></div><div class="controls"><button id="start">Start Quiz</button></div></section>
<section class="panel hide" id="game"><div class="topline"><div class="eyebrow" id="progress">Question 1</div><div class="muted">Answer for: <strong id="activeTeam"></strong></div></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="message" id="message" aria-live="polite"></div><div class="controls"><button class="secondary" id="next" disabled>Next Question</button><button class="secondary" id="bell">🔔 Play Bell</button></div></section>
<section class="panel hide" id="scoreboard"><h2>Team scores</h2><div class="teams" id="teams"></div><div class="controls"><button id="restart">Play Again</button><a class="secondary" style="padding:11px 15px;border-radius:10px;text-decoration:none" href="../index.html">Back to Library</a></div></section><div class="footer">Quiz questions are for practice. Discuss answers together!</div></main>
<script>
const sets={
c6:{title:"Class 6 — Social Science Quiz",subject:"Social Science",questions:[{q:"Which is the largest continent by area?",a:["Africa","Asia","Europe","South America"],c:1},{q:"What is the main source of energy for Earth?",a:["The Moon","The Sun","Wind","Coal"],c:1},{q:"Which direction does the Sun appear to rise from?",a:["North","South","East","West"],c:2},{q:"A globe is a model of what?",a:["The Moon","Earth","The Sun","A map"],c:1},{q:"Which is a major source of fresh water?",a:["Oceans","Rivers","Seas","Salt lakes"],c:1}]},
c8:{title:"Class 8 — Social Science Quiz",subject:"Social Science",questions:[{q:"In which year did the Battle of Plassey take place?",a:["1757","1764","1857","1947"],c:0},{q:"What is the supreme law of India?",a:["A state rule","The Constitution","A court order","A budget"],c:1},{q:"Which imaginary line divides Earth into Northern and Southern Hemispheres?",a:["Prime Meridian","Equator","Tropic of Cancer","Arctic Circle"],c:1},{q:"What does the term ‘secular’ mean in the Indian Constitution?",a:["One official religion","Equal respect for all religions","No elections","Rule by the army"],c:1},{q:"Which institution makes laws at the Union level in India?",a:["Parliament","Election Commission","Supreme Court","Cabinet Secretariat"],c:0}]},
c9:{title:"Class 9 — Social Science Quiz",subject:"Social Science",questions:[{q:"In which year did the French Revolution begin?",a:["1776","1789","1815","1848"],c:1},{q:"What is the elected law-making body of a democracy called?",a:["Parliament","Monarchy","Census","Judiciary"],c:0},{q:"Which line of latitude passes through India?",a:["Equator","Tropic of Cancer","Tropic of Capricorn","Arctic Circle"],c:1},{q:"What is the livelihood of many people in Palampur based on?",a:["Fishing","Farming","Mining","Shipbuilding"],c:1},{q:"Which of these is a fundamental right in India?",a:["Right to Equality","Right to Rule","Right to Tax","Right to Ignore Laws"],c:0}]},
c10:{title:"Class 10 — History Quiz",subject:"Social Science",questions:[{q:"Who led the Salt March in 1930?",a:["Jawaharlal Nehru","Mahatma Gandhi","Subhas Chandra Bose","Sardar Patel"],c:1},{q:"In which year did the Non-Cooperation Movement begin?",a:["1905","1919","1920","1930"],c:2},{q:"The Congress of Vienna met in which year?",a:["1789","1815","1848","1871"],c:1},{q:"Who wrote ‘Hind Swaraj’?",a:["Rabindranath Tagore","Mahatma Gandhi","B. R. Ambedkar","Bankim Chandra Chattopadhyay"],c:1},{q:"Which event is associated with 1919 in Indian history?",a:["Jallianwala Bagh massacre","Dandi March","Quit India Movement","Partition"],c:0}]}};
const params=new URLSearchParams(location.search),key=params.get("set")||"c6",quiz=sets[key]||sets.c6;document.title=quiz.title+" | Quiz Department";document.getElementById("title").textContent=quiz.title;document.getElementById("subtitle").textContent=quiz.subject+" • "+quiz.questions.length+" questions • classroom practice";
let teams=[],turn=0,index=0,timerId=null,remaining=0,locked=false;const $=id=>document.getElementById(id);
function ring(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.frequency.value=880;gain.gain.setValueAtTime(.15,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.45);osc.start();osc.stop(ctx.currentTime+.45)}catch{}}
$("bell").onclick=ring;
function start(){const count=Number($("teamCount").value);teams=Array.from({length:count},(_,i)=>({name:`Team ${i+1}`,score:0}));index=0;turn=0;$("setup").classList.add("hide");$("scoreboard").classList.add("hide");$("game").classList.remove("hide");draw()}
function draw(){clearInterval(timerId);locked=false;const item=quiz.questions[index];$("progress").textContent=`Question ${index+1} of ${quiz.questions.length}`;$("activeTeam").textContent=teams[turn%teams.length].name;$("question").textContent=item.q;$("message").textContent="";$("next").disabled=true;$("next").textContent=index===quiz.questions.length-1?"Show Scores":"Next Question";const box=$("answers");box.innerHTML="";item.a.forEach((text,i)=>{const b=document.createElement("button");b.className="answer";b.textContent=`${String.fromCharCode(65+i)}. ${text}`;b.onclick=()=>answer(i,b);box.appendChild(b)});remaining=Number($("seconds").value);clock()}
function clock(){if(!remaining){$("timer").textContent="No timer";return}$("timer").textContent=`⏱ ${remaining}s`;timerId=setInterval(()=>{remaining--;$("timer").textContent=`⏱ ${remaining}s`;if(remaining<=0){clearInterval(timerId);ring();if(!locked){locked=true;$("message").textContent="Time is up!";document.querySelectorAll(".answer").forEach(b=>b.disabled=true);document.querySelectorAll(".answer")[quiz.questions[index].c].classList.add("correct");$("next").disabled=false;turn++}}},1000)}
function answer(choice,button){if(locked)return;locked=true;clearInterval(timerId);document.querySelectorAll(".answer").forEach(b=>b.disabled=true);const correct=quiz.questions[index].c;if(choice===correct){button.classList.add("correct");teams[turn%teams.length].score++;$("message").textContent=`Correct! ${teams[turn%teams.length].name} earns 1 point.`}else{button.classList.add("wrong");document.querySelectorAll(".answer")[correct].classList.add("correct");$("message").textContent="Not quite — the correct answer is highlighted."}turn++;$("next").disabled=false}
$("start").onclick=start;$("next").onclick=()=>{if(index<quiz.questions.length-1){index++;draw()}else finish()};function finish(){clearInterval(timerId);$("game").classList.add("hide");$("scoreboard").classList.remove("hide");$("teams").innerHTML=teams.map(t=>`<div class="team">${t.name}<strong>${t.score} pts</strong></div>`).join("");$("timer").textContent="Quiz complete"}$("restart").onclick=()=>{$("scoreboard").classList.add("hide");$("setup").classList.remove("hide");$("timer").textContent="—"};
</script></body></html>
